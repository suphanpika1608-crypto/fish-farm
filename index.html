<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cozy Fish Farm Adventure</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Mali:wght@400;600;700&display=swap');

        :root {
            --primary: #81C784;
            --secondary: #4DD0E1;
            --accent: #FFB74D;
            --bg: #FFF8E1;
            --text: #5D4037;
            --pond: #B2EBF2;
        }

        body {
            font-family: 'Mali', cursive;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }

        h1 {
            color: #3E2723;
            text-align: center;
            margin-bottom: 10px;
            text-shadow: 2px 2px 0px rgba(0,0,0,0.1);
        }

        /* --- UI Header --- */
        .header-stats {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            background: white;
            padding: 10px 25px;
            border-radius: 30px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            font-size: 1.2rem;
            font-weight: 700;
        }

        /* --- Pond Area --- */
        .pond-container {
            width: 100%;
            max-width: 600px;
            height: 300px;
            background: var(--pond);
            border-radius: 40px;
            border: 8px solid #81D4FA;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 0 20px rgba(0,150,255,0.2), 0 10px 20px rgba(0,0,0,0.1);
            margin-bottom: 20px;
            cursor: pointer;
        }

        .fish {
            position: absolute;
            font-size: 2.5rem;
            transition: transform 0.5s ease;
            user-select: none;
            filter: drop-shadow(2px 4px 2px rgba(0,0,0,0.2));
            animation: float 3s ease-in-out infinite alternate;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            100% { transform: translateY(-10px); }
        }

        .food-particle {
            position: absolute;
            width: 10px;
            height: 10px;
            background-color: #8D6E63;
            border-radius: 50%;
            pointer-events: none;
            animation: sink 2s linear forwards;
        }

        @keyframes sink {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(100px) scale(0); opacity: 0; }
        }

        /* --- Controls & Inventory --- */
        .controls {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 600px;
            margin-bottom: 20px;
        }

        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 25px;
            font-family: 'Mali', cursive;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 0 #388E3C;
            transition: all 0.1s;
        }

        .btn:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #388E3C;
        }

        .btn.secondary {
            background-color: var(--secondary);
            box-shadow: 0 4px 0 #0097A7;
        }

        .btn.accent {
            background-color: var(--accent);
            box-shadow: 0 4px 0 #F57C00;
        }

        .inventory {
            display: flex;
            gap: 15px;
            background: white;
            padding: 15px;
            border-radius: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            margin-bottom: 20px;
        }

        .inventory-item {
            text-align: center;
            font-weight: 600;
        }

        /* --- Quest Board --- */
        .quest-board {
            width: 100%;
            max-width: 600px;
            background: #FFE082;
            border-radius: 20px;
            padding: 20px;
            box-sizing: border-box;
            box-shadow: 0 6px 0 #FFB300;
        }

        .quest-title {
            margin-top: 0;
            color: #E65100;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .quest-card {
            background: white;
            padding: 15px;
            border-radius: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        
        /* Audio visual feedback class */
        .pop-anim {
            animation: pop 0.3s ease;
        }

        @keyframes pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <h1>🐟 Cozy Fish Farm</h1>

    <div class="header-stats">
        <div>💰 เหรียญ: <span id="coin-display">100</span></div>
        <div>🌟 เลเวล: <span id="level-display">1</span></div>
    </div>

    <!-- บ่อปลา -->
    <div class="pond-container" id="pond" onclick="feedFish(event)">
        <!-- ปลาจะถูกสร้างที่นี่ด้วย JS -->
    </div>

    <div class="controls">
        <button class="btn" onclick="buyFish('ปลานิล', 20)">ซื้อปลานิล (20💰)</button>
        <button class="btn secondary" onclick="buyFish('ปลาทับทิม', 30)">ซื้อปลาทับทิม (30💰)</button>
        <button class="btn accent" onclick="buyFish('ปลาตะเพียน', 40)">ซื้อปลาตะเพียน (40💰)</button>
    </div>

    <div class="inventory">
        <div class="inventory-item">🐟 ปลานิล: <span id="inv-nil">0</span></div>
        <div class="inventory-item">🐠 ปลาทับทิม: <span id="inv-tubtim">0</span></div>
        <div class="inventory-item">🐡 ปลาตะเพียน: <span id="inv-tapian">0</span></div>
    </div>

    <!-- กระดานภารกิจ -->
    <div class="quest-board">
        <h2 class="quest-title">📜 ภารกิจจากชาวบ้าน</h2>
        <div id="quests-container">
            <!-- ภารกิจจะแสดงตรงนี้ -->
        </div>
    </div>

    <script>
        // State ของเกม
        let coins = 100;
        let level = 1;
        let inventory = {
            'ปลานิล': 0,
            'ปลาทับทิม': 0,
            'ปลาตะเพียน': 0
        };
        
        let fishesInPond = [];
        const pondElement = document.getElementById('pond');
        const questsContainer = document.getElementById('quests-container');

        const fishTypes = {
            'ปลานิล': { emoji: '🐟', growTime: 5, value: 30 },
            'ปลาทับทิม': { emoji: '🐠', growTime: 7, value: 45 },
            'ปลาตะเพียน': { emoji: '🐡', growTime: 10, value: 65 }
        };

        // อัปเดต UI
        function updateUI() {
            document.getElementById('coin-display').innerText = coins;
            document.getElementById('level-display').innerText = level;
            document.getElementById('inv-nil').innerText = inventory['ปลานิล'];
            document.getElementById('inv-tubtim').innerText = inventory['ปลาทับทิม'];
            document.getElementById('inv-tapian').innerText = inventory['ปลาตะเพียน'];
        }

        // ซื้อปลาลงบ่อ
        function buyFish(type, cost) {
            if (coins >= cost) {
                coins -= cost;
                spawnFishInPond(type);
                updateUI();
                playSound('splash');
            } else {
                alert('เหรียญไม่พอจ้า ทำภารกิจเพื่อหาเหรียญเพิ่มนะ!');
            }
        }

        // สร้างปลาในบ่อ
        function spawnFishInPond(type) {
            const fishObj = {
                id: Date.now() + Math.random(),
                type: type,
                stage: 0, // 0: เด็ก, 1: โต
                emoji: fishTypes[type].emoji,
                element: document.createElement('div')
            };

            fishObj.element.className = 'fish';
            fishObj.element.innerText = fishObj.emoji;
            // สุ่มตำแหน่งเริ่มต้น
            const x = Math.random() * (pondElement.offsetWidth - 50);
            const y = Math.random() * (pondElement.offsetHeight - 50);
            fishObj.element.style.left = `${x}px`;
            fishObj.element.style.top = `${y}px`;
            fishObj.element.style.transform = `scale(0.5)`; // ตัวเล็กตอนเด็ก
            
            // คลิกที่ปลาเพื่อเก็บเมื่อโตเต็มวัย
            fishObj.element.onclick = (e) => {
                e.stopPropagation(); // ป้องกันการคลิกบ่อ
                if (fishObj.stage === 1) {
                    harvestFish(fishObj);
                } else {
                    // เอฟเฟกต์ดุ๊กดิ๊กตอนเด็ก
                    fishObj.element.classList.add('pop-anim');
                    setTimeout(() => fishObj.element.classList.remove('pop-anim'), 300);
                }
            };

            pondElement.appendChild(fishObj.element);
            fishesInPond.push(fishObj);
            moveFishRandomly(fishObj);

            // ระบบเติบโต
            setTimeout(() => {
                fishObj.stage = 1;
                fishObj.element.style.transform = `scale(1.2)`; // โตแล้ว
                // เพิ่มประกายวิบวับ
                fishObj.element.innerHTML = `${fishObj.emoji}<span style="position:absolute; top:-10px; right:-10px; font-size:1rem;">✨</span>`;
                playSound('grow');
            }, fishTypes[type].growTime * 1000);
        }

        // ให้ปลาว่ายน้ำแบบสุ่ม
        function moveFishRandomly(fishObj) {
            setInterval(() => {
                if(!fishObj.element.parentElement) return;
                const newX = Math.random() * (pondElement.offsetWidth - 50);
                const newY = Math.random() * (pondElement.offsetHeight - 50);
                // กลับด้านปลาตามทิศทาง
                const currentX = parseFloat(fishObj.element.style.left);
                const scaleX = newX > currentX ? -1 : 1;
                const baseScale = fishObj.stage === 1 ? 1.2 : 0.5;
                
                fishObj.element.style.transition = 'all 3s ease-in-out';
                fishObj.element.style.left = `${newX}px`;
                fishObj.element.style.top = `${newY}px`;
                fishObj.element.style.transform = `scaleX(${scaleX}) scaleY(${baseScale})`;
            }, 3000);
        }

        // ให้อาหารปลา (Visual Effect)
        function feedFish(e) {
            const rect = pondElement.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            for(let i=0; i<3; i++){
                const food = document.createElement('div');
                food.className = 'food-particle';
                food.style.left = `${x + (Math.random()*20-10)}px`;
                food.style.top = `${y}px`;
                pondElement.appendChild(food);
                
                setTimeout(() => food.remove(), 2000);
            }
        }

        // เก็บปลาเข้าคลัง
        function harvestFish(fishObj) {
            inventory[fishObj.type]++;
            fishObj.element.remove();
            fishesInPond = fishesInPond.filter(f => f.id !== fishObj.id);
            updateUI();
            playSound('harvest');
        }

        // ระบบภารกิจ
        function generateQuest() {
            const types = Object.keys(fishTypes);
            const reqType = types[Math.floor(Math.random() * types.length)];
            const reqAmount = Math.floor(Math.random() * 3) + 1;
            const reward = (fishTypes[reqType].value * reqAmount) + 20;

            const questId = Date.now();
            const questCard = document.createElement('div');
            questCard.className = 'quest-card';
            questCard.id = `quest-${questId}`;
            
            questCard.innerHTML = `
                <div>
                    <strong>คุณยายสมศรีต้องการ:</strong><br>
                    ${fishTypes[reqType].emoji} ${reqType} ${reqAmount} ตัว
                </div>
                <div>
                    <button class="btn accent" style="padding: 8px 15px; font-size:1rem;" onclick="completeQuest('${questId}', '${reqType}', ${reqAmount}, ${reward})">
                        ส่งปลา (รับ ${reward}💰)
                    </button>
                </div>
            `;
            questsContainer.appendChild(questCard);
        }

        // ส่งภารกิจ
        window.completeQuest = function(questId, type, amount, reward) {
            if (inventory[type] >= amount) {
                inventory[type] -= amount;
                coins += reward;
                document.getElementById(`quest-${questId}`).remove();
                updateUI();
                playSound('success');
                generateQuest(); // สร้างภารกิจใหม่มาแทนที่
            } else {
                alert(`คุณมี ${type} ไม่พอจ้า ต้องรอปลาโตแล้วกดเก็บก่อนนะ!`);
            }
        }

        // เสียงจำลอง (ใช้ Web Audio API เล็กๆ เพื่อความ Cozy)
        function playSound(type) {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);

            if (type === 'splash') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(600, ctx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.1, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1);
                osc.start(); osc.stop(ctx.currentTime + 0.1);
            } else if (type === 'grow') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(600, ctx.currentTime);
                osc.frequency.setValueAtTime(800, ctx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.1, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.2);
                osc.start(); osc.stop(ctx.currentTime + 0.2);
            } else if (type === 'harvest') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(800, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1200, ctx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.1, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1);
                osc.start(); osc.stop(ctx.currentTime + 0.1);
            } else if (type === 'success') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(400, ctx.currentTime);
                osc.frequency.setValueAtTime(600, ctx.currentTime + 0.1);
                osc.frequency.setValueAtTime(800, ctx.currentTime + 0.2);
                gain.gain.setValueAtTime(0.05, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
                osc.start(); osc.stop(ctx.currentTime + 0.3);
            }
        }

        // เริ่มต้นเกม
        updateUI();
        generateQuest();
        generateQuest(); // สร้างไว้ 2 ภารกิจเริ่มต้น
    </script>
</body>
</html>
